    light-dark(rgb(255 255 255), rgb(24 24 24))

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {

  background-color: var(--primary);
}

.form-check:not(.form-switch)

  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);

}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;

  background: var(--muted);
  box-shadow: none;

.form-switch .form-check-input::before {

  top: 50%;
  left: 0;

  height: 16px;

  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));

  box-shadow: var(--shadow-sm);

  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);

  border-color: var(--ring);

}

.form-range::-moz-range-track {
  height: 28px;

}

  border-color: var(--ring);

}

.form-range:disabled {

}

        &lt;p class=&quot;k3-breadcrumb&quot;&gt;Agents &amp;amp; Harnesses / Field Guide 01&lt;/p&gt;
        &lt;header class=&quot;k3-article-head&quot;&gt;
          &lt;h1 class=&quot;k3-article-title&quot;&gt;How to Build an Agent Harness&lt;/h1&gt;
          &lt;p class=&quot;k3-article-dek&quot;&gt;A model is only one component. Reliability comes from the system that assembles context, mediates tools, records traces, and turns failures into better evaluations.&lt;/p&gt;
          &lt;div class=&quot;k3-meta&quot;&gt;&lt;span&gt;Mar 22, 2026&lt;/span&gt;&lt;span&gt;16 min&lt;/span&gt;&lt;span&gt;Updated Aug 19&lt;/span&gt;&lt;span&gt;12 sources&lt;/span&gt;&lt;/div&gt;
        &lt;/header&gt;

        &lt;div class=&quot;k3-article-layout&quot;&gt;
          &lt;aside class=&quot;k3-toc&quot; aria-label=&quot;Article contents&quot;&gt;
            &lt;p class=&quot;k3-toc-title&quot;&gt;On this page&lt;/p&gt;
            &lt;a href=&quot;#k3-problem&quot;&gt;The real problem&lt;/a&gt;&lt;a href=&quot;#k3-loop&quot;&gt;Harness loop&lt;/a&gt;&lt;a href=&quot;#k3-evidence&quot;&gt;Evidence&lt;/a&gt;&lt;a href=&quot;#k3-failures&quot;&gt;Failure modes&lt;/a&gt;&lt;a href=&quot;#k3-sources&quot;&gt;Sources&lt;/a&gt;
          &lt;/aside&gt;
          &lt;article class=&quot;k3-article-body&quot;&gt;
            &lt;section class=&quot;k3-key-points&quot; aria-label=&quot;Key takeaways&quot;&gt;
              &lt;h3&gt;Three takeaways&lt;/h3&gt;
              &lt;ul&gt;&lt;li&gt;Harness design changes outcomes even when the underlying model stays fixed.&lt;/li&gt;&lt;li&gt;Tools need policy boundaries, observable traces, and explicit failure handling.&lt;/li&gt;&lt;li&gt;Evaluations should test the system—not only the model response.&lt;/li&gt;&lt;/ul&gt;
            &lt;/section&gt;

            &lt;h2 id=&quot;k3-problem&quot;&gt;The model is not the product&lt;/h2&gt;
            &lt;p&gt;Agent quality emerges from an entire execution environment. The harness decides what context the model sees, which actions it may take, how errors return, and what evidence survives after the run.&lt;/p&gt;
            &lt;p&gt;That means two products can use the same model and still produce very different results. The important design question is no longer only “which model?” It is “which feedback loop surrounds it?”&lt;/p&gt;

            &lt;figure class=&quot;k3-inline-diagram&quot; id=&quot;k3-loop&quot; aria-label=&quot;Closed-loop agent system diagram&quot;&gt;
              &lt;div class=&quot;k3-inline-flow&quot;&gt;&lt;div class=&quot;k3-inline-node&quot;&gt;CONTEXT&lt;/div&gt;&lt;span class=&quot;k3-inline-arrow&quot;&gt;→&lt;/span&gt;&lt;div class=&quot;k3-inline-node&quot;&gt;ACT + OBSERVE&lt;/div&gt;&lt;span class=&quot;k3-inline-arrow&quot;&gt;→&lt;/span&gt;&lt;div class=&quot;k3-inline-node&quot;&gt;EVALUATE&lt;/div&gt;&lt;/div&gt;
            &lt;/figure&gt;
            &lt;p class=&quot;k3-caption&quot;&gt;Figure 1 · A dependable harness closes the loop between context, action, observation, and evaluation.&lt;/p&gt;

            &lt;h2 id=&quot;k3-evidence&quot;&gt;What to measure&lt;/h2&gt;
            &lt;p&gt;Measure task completion, policy compliance, recovery from tool failure, context efficiency, and the quality of the final evidence. A successful response without a trustworthy trace is still difficult to improve.&lt;/p&gt;
            &lt;div class=&quot;k3-evidence&quot;&gt;&lt;strong&gt;Evidence rule&lt;/strong&gt;&lt;span&gt;Keep the claim, observation, and supporting trace adjacent. Readers should be able to distinguish measured results from design opinion.&lt;/span&gt;&lt;/div&gt;

            &lt;h2 id=&quot;k3-failures&quot;&gt;Failure modes worth publishing&lt;/h2&gt;
            &lt;p&gt;Document where the harness stalled, repeated work, selected the wrong tool, or carried stale facts forward. These are often more useful than polished success narratives because they reveal which assumptions are actually load-bearing.&lt;/p&gt;
          &lt;/article&gt;

&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&#x27;kuma-top-three-redesign&#x27;);
    const site = document.getElementById(&#x27;k3-site&#x27;);
    const status = document.getElementById(&#x27;k3-review-status&#x27;);
    if (!root || !site || !status) return;

    const themeCopy = {
      journal: &#x27;Paper Journal · trust-first editorial system for research and long-form writing&#x27;,
      control: &#x27;Control Room · technical identity for harness guides, experiments, traces, and evals&#x27;,
      mori: &#x27;Mori Notebook · original Japanese-inspired field journal with a warmer personal voice&#x27;
    };

    const themeButtons = [...root.querySelectorAll(&#x27;[data-k3-theme]&#x27;)];
    const viewButtons = [...root.querySelectorAll(&#x27;[data-k3-view]&#x27;)];

    themeButtons.forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
      const theme = button.getAttribute(&#x27;data-k3-theme&#x27;);
      site.setAttribute(&#x27;data-theme&#x27;, theme);
      status.textContent = themeCopy[theme] || themeCopy.journal;
      themeButtons.forEach((candidate) =&gt; candidate.setAttribute(&#x27;aria-pressed&#x27;, candidate === button ? &#x27;true&#x27; : &#x27;false&#x27;));
    }));

    viewButtons.forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
      const view = button.getAttribute(&#x27;data-k3-view&#x27;);
      site.setAttribute(&#x27;data-view&#x27;, view);
      viewButtons.forEach((candidate) =&gt; candidate.setAttribute(&#x27;aria-pressed&#x27;, candidate === button ? &#x27;true&#x27; : &#x27;false&#x27;));
    }));
  })();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
