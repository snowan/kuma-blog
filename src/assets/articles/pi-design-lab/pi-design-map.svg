<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Pi: history, context and execution</title><desc id="desc">A session tree provides a selected path. Compaction assembles bounded context for a provider. Tool results return to history, while a separate lane persists execution state.</desc><rect width="1200" height="600" fill="#06100e"/><g font-family="system-ui,sans-serif" fill="#e9fff4"><text x="70" y="80" font-size="20" fill="#68ffb5">PI DESIGN LAB</text><text x="70" y="140" font-size="42">One history. A bounded working context.</text><g stroke="#68ffb5" stroke-width="2" fill="#0a1714"><rect x="70" y="220" width="290" height="130" rx="12"/><rect x="455" y="220" width="290" height="130" rx="12"/><rect x="840" y="220" width="290" height="130" rx="12"/></g><g font-size="26" text-anchor="middle"><text x="215" y="274">Session tree</text><text x="600" y="274">Working context</text><text x="985" y="274">Provider + tools</text></g><g font-size="17" text-anchor="middle" fill="#a1b8ad"><text x="215" y="314">select an ancestor path</text><text x="600" y="314">summary + recent messages</text><text x="985" y="314">request → result</text></g><g stroke="#67d6ff" stroke-width="3" fill="none"><path d="M360 285h85m-15-10 15 10-15 10M745 285h85m-15-10 15 10-15 10M985 350v70H215v-60m-10 15 10-15 10 15"/></g><text x="600" y="408" font-size="17" text-anchor="middle" fill="#67d6ff">append results to readable history</text><rect x="70" y="465" width="1060" height="70" rx="12" fill="#0b1d19" stroke="#295348"/><text x="100" y="508" font-size="21">Execution lane · persisted operation state · explicit replay policy</text><text x="70" y="575" font-size="15" fill="#a1b8ad">Conceptual relationships, not a measured execution trace. Historical and current runtime designs differ.</text></g></svg>