status: "governance-only"

guardrails:
  moves_approved: false
  merges_approved: false
  archives_approved: false
  deletions_approved: false
  publishing_approved: false
  note: >-
    This manifest records proposed destinations and review requirements. It does
    not authorize a filesystem or publication change.

audit_baseline:
  date: "2026-08-20"
  tracked_base_revision: "800496a837c552c4a393a773d4c122ff525d5132"
  scope: "local working tree, including untracked Markdown"
  includes_this_governance_change: false
  refresh_required_before_migration: true
  documents: 273
  post_candidates: 176
  support_documents: 97
  words: 268199
  exact_duplicate_groups: 1
  similar_pairs_at_0_72: 11
  hard_phrase_findings: 15
  documents_with_hard_findings: 11
  broken_relative_links: 1
  interpretation: >-
    Scanner findings are editorial triage cues, not authorship probabilities or
    automatic deletion decisions.

classification_rules:
  - "An exact path in canonical_clusters overrides a family glob."
  - "Protected similarity groups cannot be merged by an automated migration."
  - >-
    Family globs are discovery scopes, not executable move rules. A file that
    matches more than one family remains unclassified until a reviewed entry
    selects one destination.
  - >-
    No disposition authorizes a move, merge, archive, deletion, or publication
    while the corresponding top-level guardrail is false.

target_topics:
  - "agents-harnesses"
  - "memory-context"
  - "evals-reliability"
  - "inference-systems"

target_series:
  - "harness-lab"
  - "memory-lab"
  - "agent-reliability-notes"
  - "agent-standards-map"

families:
  - id: "canonical-ai-writing"
    sources:
      - "AI-blogs/*.md"
      - "AI/AI-article-analysis/**/*.md"
      - "AI/ai-resources/**/*.md"
    proposed_destination: "src/content/writing/<topic>/"
    disposition: "review-and-select"
    implementation_status: "pending"
    requirements:
      - "Assign a specific reader outcome and topic."
      - "Search for overlapping claims before migration."
      - "Review metadata, sources, links, and factual freshness."
      - "Do not publish support files as articles."

  - id: "lab-notes-and-evals"
    sources:
      - "AI/ai-resources/evals/**/*.md"
      - "AI/ai-resources/AI-common/**/*.md"
      - "AI/claude-code/runbooks/**/*.md"
    proposed_destination: "src/content/lab-notes/<topic>/"
    disposition: "review-and-select"
    implementation_status: "pending"
    requirements:
      - "State environment, evidence, limitations, and failure modes."
      - "Link privacy-safe reproducibility artifacts when available."

  - id: "ai-news-digests"
    sources:
      - "AI/reports/**/*.md"
    proposed_destination: "archive/ai-news-digests/"
    disposition: "archive-candidate"
    implementation_status: "pending-explicit-approval"
    requirements:
      - "Keep selected durable syntheses only after factual refresh."
      - "Do not include routine digests in the main publication feed."

  - id: "visual-explainers"
    sources:
      - "AI-manga-learnings/**"
      - "AI-slide-learnings/**"
      - "AI/AI-manga-learnings/**"
      - "AI-blogs/infographic/**"
    proposed_destination: "src/content/visuals/<topic>/"
    support_destination: "studio/"
    disposition: "split-final-from-support"
    implementation_status: "pending"
    requirements:
      - "Publish only the reviewed final explainer and method or source note."
      - "Move prompts, storyboards, character sheets, and intermediates to the studio layer."
      - "Keep Japanese-inspired work original and avoid protected trade dress."

  - id: "embedded-agent-applications"
    sources:
      - "AI/kuma-ai-agents/**"
    proposed_destination: "labs/ or a dedicated repository"
    disposition: "keep-in-place"
    implementation_status: "deferred"
    requirements:
      - "Preserve current CI paths until a separate application decision is approved."
      - "Do not publish application source as blog content."

  - id: "system-design-archive"
    sources:
      - "AI-blogs/design-*.md"
      - "AI-blogs/chess-system-design.md"
    proposed_destination: "archive/system-design/"
    disposition: "archive-candidate"
    implementation_status: "pending-explicit-approval"
    requirements:
      - "Preserve filenames or record redirects before a move."
      - "Promote an article later only after source and tradeoff review."

  - id: "leetcode-archive"
    sources:
      - "Leetcode/**"
      - "Google/*palindrome*.md"
    proposed_destination: "archive/leetcode/"
    disposition: "archive-candidate"
    implementation_status: "pending-explicit-approval"
    requirements:
      - "Preserve translations and related problem variants as distinct documents."
      - "Remove the collection from the main AI feed, not from repository history."

  - id: "books-and-readings"
    sources:
      - "Books/**"
      - "Readings/**"
    proposed_destination: "archive/books/"
    disposition: "archive-candidate"
    implementation_status: "pending-explicit-approval"
    requirements:
      - "Review empty placeholders separately before deletion."

  - id: "setup-and-general-engineering"
    sources:
      - "Setup/**"
      - "Languages/**"
      - "kubernetes/**"
      - "Google/**"
    proposed_destination: "archive/setup/ or archive/legacy-ai/"
    disposition: "classify-before-archive"
    implementation_status: "pending-explicit-approval"
    requirements:
      - "Do not absorb protected algorithm documents into unrelated articles."

  - id: "personal-archive"
    sources:
      - "Entertainment/**"
      - "travels/**"
    proposed_destination: "archive/personal/"
    disposition: "archive-candidate"
    implementation_status: "pending-explicit-approval"

  - id: "shared-assets"
    sources:
      - "assets/**"
      - "AI-blogs/resources/**"
      - "AI/**/resources/**"
    proposed_destination: "src/assets/articles/<slug>/, studio/, or archive/"
    disposition: "classify-by-owner"
    implementation_status: "pending"
    requirements:
      - "Move an asset only with its owning content migration."
      - "Optimize only reviewed publication assets."
      - "Do not commit temporary packages or generated archives."

  - id: "repository-governance"
    sources:
      - "AGENTS.md"
      - ".agents/**"
      - ".claude/**"
      - ".github/**"
      - "docs/**"
      - "designs/**"
    proposed_destination: "keep-in-place"
    disposition: "operational"
    implementation_status: "active"
    requirements:
      - "Exclude operational material from public content collections."

