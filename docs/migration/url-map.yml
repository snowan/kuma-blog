schema_version: 1
updated_at: "2026-08-20"
status: "proposed"

site:
  origin: "https://snowan.github.io"
  base_path: "/kuma-blog/"
  canonical_route_rule: >-
    Public routes are derived from reviewed content type and slug, not from the
    legacy repository directory.

guardrails:
  redirects_implemented: false
  legacy_paths_changed: false
  note: >-
    Entries record route intent only. A later migration PR must verify inbound
    links and implement or test any required static redirect.

route_patterns:
  writing: "/writing/<slug>/"
  lab_note: "/lab-notes/<slug>/"
  visual: "/visuals/<slug>/"
  topic: "/topics/<topic>/"
  series: "/series/<series>/"

entries:
  - source: "AI-blogs/demystifying-agent-harness.md"
    target: "/writing/demystifying-agent-harness/"
    action: "migrate-canonical"
    status: "canonical-draft-prepared-publication-pending"

  - source: "AI-blogs/how-to-build-agent-harness.md"
    target: "/writing/how-to-build-agent-harness/"
    action: "migrate-canonical"
    status: "canonical-draft-prepared-publication-pending"

  - source: "AI-blogs/agent-harness-deep-dive.md"
    target: "/series/harness-lab/"
    action: "merge-source-then-static-redirect"
    status: "unique-material-reviewed-redirect-and-retirement-pending"

  - source: "AI-blogs/boris-cherny-customize-claude-code.md"
    target: "/writing/customizing-claude-code/"
    action: "migrate-canonical-candidate"
    status: "pending-editorial-review"

  - source: "AI-blogs/claude-code-customization-guide.md"
    target: null
    action: "review-untracked-duplicate"
    status: "pending-explicit-approval"

  - source: "AI/ai-resources/context-engineering/context-engineering.md"
    target: "/writing/context-engineering/"
    action: "migrate-canonical"
    status: "canonical-draft-prepared-publication-pending"

  - source: "AI/ai-resources/context-engineering/context-engineering-with-file-system.md"
    target: "/writing/filesystem-context-engineering/"
    action: "migrate-canonical"
    status: "canonical-draft-prepared-publication-pending"

  - source: "AI/AI-article-analysis/memory-in-the-age-of-agent-survey.md"
    target: "/writing/agent-memory-survey/"
    action: "migrate-to-memory-series"
    status: "pending"

  - source: "AI/AI-article-analysis/ai-agent-memory/ai-agent-memory-deep-dive.md"
    target: "/writing/agent-memory-deep-dive/"
    action: "migrate-to-memory-series"
    status: "pending"

  - source: "AI/AI-manga-learnings/memory-in-the-age-of-ai-agent/learning-series.md"
    target: "/visuals/agent-memory-learning-series/"
    action: "migrate-final-visual-only"
    status: "pending"

family_rules:
  - sources:
      - "AI-blogs/design-*.md"
      - "AI-blogs/chess-system-design.md"
    destination: "archive/system-design/"
    public_route: "/archive/"
    redirect_policy: "assess-known-inbound-links-before-each-batch"
    status: "pending-explicit-approval"

  - sources:
      - "Leetcode/**"
      - "Google/*palindrome*.md"
    destination: "archive/leetcode/"
    public_route: null
    redirect_policy: "preserve-repository-history; assess-external-links"
    status: "pending-explicit-approval"

  - sources:
      - "Books/**"
      - "Readings/**"
    destination: "archive/books/"
    public_route: null
    redirect_policy: "assess-external-links"
    status: "pending-explicit-approval"

validation_required_for_each_migration:
  - "Legacy source path and canonical route are recorded."
  - "Known inbound links are checked."
  - "Internal Markdown links and images resolve."
  - "The generated route works below /kuma-blog/."
  - "Canonical metadata points to the public route."
  - "A static redirect is generated when an established public route changes."
  - "The old file is removed only after the redirect and diff are reviewed."
