name: Site CI

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/site-ci.yml"
      - "astro.config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "src/**"
      - "public/**"
      - "tools/site/**"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/site-ci.yml"
      - "astro.config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "src/**"
      - "public/**"
      - "tools/site/**"

permissions:
  contents: read

jobs:
  site:
    name: Astro foundation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify static site
        run: pnpm verify
